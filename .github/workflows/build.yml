name: Build portable apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: python -m pip install -r requirements.txt -r server/requirements.txt
      - run: python scripts/security_audit.py
      - env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-build.txt -r server/requirements.txt
      - env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MultiDocSync-Windows-x64
          path: dist/MultiDocSync-Windows-x64.exe

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-build.txt -r server/requirements.txt
      - env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - run: bash scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MultiDocSync-macOS-arm64
          path: dist/MultiDocSync-macOS-arm64.zip
